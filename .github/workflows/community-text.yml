# Adds quest text that players share (a "Share quest text" issue, labelled
# quest-text, holding a /lp share code) to Data/CommunityText.lua on the
# data/community-text branch, and opens or updates one PR from it. It replies on
# the issue with what was added. Nothing reaches a release until a maintainer
# merges the PR. Issue #14.
name: Add shared quest text

on:
  issues:
    # Not "labeled": an issue form's label arrives with "opened", and both
    # firing would merge the same code twice.
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: community-text
  cancel-in-progress: false

env:
  TEXT_BRANCH: data/community-text

jobs:
  merge:
    if: contains(github.event.issue.labels.*.name, 'quest-text')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lupa
        run: pip install lupa

      # Keep adding to the open PR's branch; once that PR is merged or closed,
      # start a fresh branch from the default branch.
      - name: Check out the community text branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pr=$(gh pr list --head "$TEXT_BRANCH" --base "$BASE" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ] && git ls-remote --exit-code --heads origin "$TEXT_BRANCH" > /dev/null; then
            git switch -C "$TEXT_BRANCH" "origin/$TEXT_BRANCH"
            git merge --no-edit "origin/$BASE"
          else
            git switch -C "$TEXT_BRANCH" "origin/$BASE"
          fi
          echo "PR=$pr" >> "$GITHUB_ENV"

      # The issue body is untrusted text: it reaches the script as a file, never
      # as part of a command. Share codes are parsed as JSON, not run.
      - name: Merge the submitted text
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/submission.txt"
          python3 tools/merge_quest_text.py --replace --report "$RUNNER_TEMP/report.md" "$RUNNER_TEMP/submission.txt"

      - name: Run tests with the new text
        run: python3 tools/test/run_tests.py

      - name: Commit, push and open or update the PR
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if git diff --quiet -- Data/CommunityText.lua; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git add Data/CommunityText.lua
          git commit -m "Quest text shared in #$ISSUE"
          git push origin "$TEXT_BRANCH"
          if [ -n "$PR" ]; then
            { echo "Added quest text shared in #$ISSUE:"; cat "$RUNNER_TEMP/report.md"; } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          else
            body="$RUNNER_TEMP/body.md"
            {
              echo "Quest text shared by players with \`/lp share\`, added to \`Data/CommunityText.lua\` by [this workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
              echo
              echo "Each submission is one commit, and later submissions replace earlier wording for the same quest. Review the text (no leftover character names, nothing that isn't quest text) before merging."
              echo
              echo "Refs #14"
              echo
              echo "From #$ISSUE:"
              cat "$RUNNER_TEMP/report.md"
            } > "$body"
            # Needs Settings > Actions > General > "Allow GitHub Actions to
            # create and approve pull requests" to be on.
            gh pr create --base "$BASE" --head "$TEXT_BRANCH" --title "Quest text shared by players" --body-file "$body"
          fi

      - name: Reply on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          reply="$RUNNER_TEMP/reply.md"
          {
            if [ -f "$RUNNER_TEMP/report.md" ]; then
              echo "Thanks for sharing! Here's what the check found:"
              echo
              cat "$RUNNER_TEMP/report.md"
              echo
              if [ "$CHANGED" = "true" ]; then
                echo "It's been added to the pending quest text PR, and will reach everyone once a maintainer reviews it and it's released."
              fi
            else
              echo "Sorry, the check couldn't process this ([log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). A maintainer will take a look."
            fi
          } > "$reply"
          gh issue comment "$ISSUE" --body-file "$reply"
