  <!-- an unexplored branch -->
  <path d="M352 300 C 392 320, 410 360, 424 396" fill="none" stroke="#bfe9f5" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.7"/>
