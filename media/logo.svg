  <!-- light rising from the pages -->
  <circle cx="118" cy="446" r="46" fill="#ffd46a" opacity="0.35" filter="url(#bigglow)"/>
  <circle cx="118" cy="446" r="7" fill="#fff4c8"/>

  <!-- the storyline trail: wide soft glow, then a bright core -->
  <path d="M118 446 C 112 396, 150 362, 200 352 C 262 340, 336 342, 352 300 C 368 258, 322 228, 270 232 C 206 236, 146 214, 160 172 C 172 132, 236 136, 262 118 C 280 106, 286 100, 290 96" fill="none" stroke="#ffd56a" stroke-width="20" stroke-linecap="round" opacity="0.35" filter="url(#bigglow)"/>
