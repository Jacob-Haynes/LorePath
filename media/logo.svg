<!-- gems: one at the top centre, one in each corner -->
<g stroke="#3a2404" stroke-width="2">
  <path d="M256 2 L 274 20 L 256 38 L 238 20 Z" fill="url(#gold)" filter="url(#metal)"/>
  <circle cx="256" cy="20" r="8" fill="url(#gemBlue)"/>
  <circle cx="30" cy="30" r="10" fill="url(#gold)" filter="url(#metal)"/>
  <circle cx="30" cy="30" r="5.5" fill="url(#gemBlue)"/>
  <circle cx="482" cy="30" r="10" fill="url(#gold)" filter="url(#metal)"/>
